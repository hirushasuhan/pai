name: Windows CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-research:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install cryptography

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Rust Core Binary
        working-directory: core
        run: |
          cargo build --release

      - name: Run Full Python Test Suite (All 37 Modules)
        working-directory: research
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Telemetry
        working-directory: research
        run: |
          python main.py --telemetry

      - name: Verify Stateless Purge Benchmark
        working-directory: research
        run: |
          python main.py --benchmark --iterations 8

      - name: Verify Ingestion & Raw Transport (live network - informational, must not block merges)
        continue-on-error: true
        working-directory: research
        run: |
          python main.py --ask "Summarize" --topic "Rust (programming language)" --transport raw

  rust-core:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python for conformance drift check
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install cryptography

      - name: Conformance Drift Check
        run: |
          python research/conformance.py
          git diff --exit-code research/conformance

      - name: Rust Format Check
        working-directory: core
        run: |
          cargo fmt --all --check

      - name: Rust Clippy
        working-directory: core
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Rust Test Suite
        working-directory: core
        run: |
          cargo test

      - name: Verify Unsafe Isolation (win32.rs only per ADR-009)
        run: |
          $unsafe_matches = Get-ChildItem -Path core/src -Filter "*.rs" | Where-Object { $_.Name -ne "win32.rs" } | Select-String -Pattern "unsafe\s*(\{|fn|trait|impl)"
          if ($unsafe_matches) {
            Write-Error "CRITICAL: Unsafe code detected outside win32.rs: $unsafe_matches"
            exit 1
          }

      - name: Conformance Vectors CLI Runner
        working-directory: core
        run: |
          cargo run -- --conformance ../research/conformance

      - name: Differential Fuzz Verification (10,000 cases)
        working-directory: research
        run: |
          python conformance.py --fuzz 10000 --seed 42

      - name: Rust Win32 Telemetry Check
        working-directory: core
        run: |
          cargo run -- --telemetry
          cargo run -- --telemetry --json

      - name: Telemetry Parity Check (Python vs Rust ±5% per ADR-009)
        working-directory: research
        env:
          PAI_REQUIRE_RUST_CORE: "1"
        run: |
          python -m unittest tests/test_telemetry_parity.py

      - name: Milestone M1 Unit Tests (Track L / ADR-008)
        working-directory: research
        run: |
          python -m unittest tests/test_m1_code.py

      - name: Build Release Rust Core Binary
        working-directory: core
        run: |
          cargo build --release

      - name: Differential Integration Test Suites (Rust Core vs Python Reference)
        working-directory: research
        run: |
          python -c "
          import sys, os, unittest
          sys.path.insert(0, 'tests')
          sys.path.insert(0, '.')

          ALLOWED_SKIP_REASONS = [
              'Directory junctions are Windows-specific',
              'Symlinks require privilege on Windows',
              'Symlinks not supported on this user/platform',
              'mklink /J not permitted in current environment',
              'mklink /J failed',
          ]

          for flag_val in ('0', '1'):
              os.environ['PAI_USE_RUST_CORE'] = flag_val
              print(f'=== RUNNING DIFFERENTIAL SUITES WITH PAI_USE_RUST_CORE={flag_val} ===')
              loader = unittest.TestLoader()
              suites = [
                  loader.loadTestsFromName('test_bridge_differential'),
                  loader.loadTestsFromName('test_ingest_differential'),
                  loader.loadTestsFromName('test_updater_differential'),
              ]
              all_suite = unittest.TestSuite(suites)
              runner = unittest.TextTestRunner(verbosity=2)
              result = runner.run(all_suite)
              if not result.wasSuccessful():
                  sys.exit(f'FATAL: Differential tests failed with PAI_USE_RUST_CORE={flag_val} (failures={len(result.failures)}, errors={len(result.errors)})')
              if result.testsRun < 45:
                  sys.exit(f'FATAL: Expected at least 45 differential tests, but only {result.testsRun} were executed!')
              for test_case, reason in result.skipped:
                  reason_str = str(reason).strip()
                  if not any(allowed in reason_str for allowed in ALLOWED_SKIP_REASONS):
                      sys.exit(f'FATAL: Differential test \'{test_case}\' skipped with unauthorized reason: {reason_str}')
              print(f'SUCCESS: All {result.testsRun} differential tests passed with PAI_USE_RUST_CORE={flag_val} ({len(result.skipped)} allowed skips).')
          "

      - name: Windows Real-Tree Parity Regression Gate (Adversarial Hazards & Shadow Verification)
        run: |
          python tools/windows_parity_run.py

  linux-portability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: research
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography

      - name: Install bubblewrap for M2 Linux sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ensure bwrap has standard non-setuid permissions (0755) because modern bwrap
          # explicitly rejects setuid execution, relying instead on unprivileged user namespaces.
          sudo chmod 0755 /usr/bin/bwrap || true
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi

      - name: Verify Bubblewrap Functional Check on Linux (Fail-closed gate)
        working-directory: research
        run: |
          python -c "
          import shutil, sys
          from sandbox_linux import is_bwrap_available, is_bwrap_functional, probe_linux_boundary
          if not is_bwrap_available():
              sys.exit('FATAL: bwrap executable not found in PATH on Linux CI')
          if not is_bwrap_functional():
              sys.exit('FATAL: is_bwrap_functional() returned False on Linux CI (unprivileged namespaces restricted or mount resolution failed)')
          ok, msg = probe_linux_boundary()
          if not ok:
              sys.exit(f'FATAL: probe_linux_boundary() failed on Linux CI: {msg}')
          print('Bubblewrap sandbox and behavioural probe verified successfully on Linux CI:', msg)
          "

      - name: Run Linux Sandbox Adversarial Test Suite (Assert Zero Skips)
        working-directory: research
        run: |
          python -c "
          import unittest, sys
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName('tests.test_sandbox_linux')
          runner = unittest.TextTestRunner(verbosity=2)
          result = runner.run(suite)
          if not result.wasSuccessful():
              sys.exit(f'FATAL: Linux sandbox tests failed (failures={len(result.failures)}, errors={len(result.errors)})')
          if result.testsRun == 0:
              sys.exit('FATAL: Zero Linux sandbox tests were executed!')
          if len(result.skipped) > 0:
              sys.exit(f'FATAL: {len(result.skipped)} Linux sandbox tests were skipped on Linux CI! Zero skips allowed on Linux host.')
          print(f'All {result.testsRun} Linux sandbox tests ran and passed with ZERO skips.')
          "

      - name: Execute M2a Adversarial Containment Matrix on Linux CI
        working-directory: research
        run: |
          python run_m2a_matrix.py || { echo '=== M2A MATRIX EXECUTION LOG ON FAILURE ==='; cat ../docs/evidence/m2a_sandbox_raw.log 2>/dev/null || true; exit 1; }
          test -s ../docs/evidence/m2a_sandbox_results.json || { echo "FATAL: m2a_sandbox_results.json is missing or empty"; exit 1; }
          test -s ../docs/evidence/m2a_sandbox_raw.log || { echo "FATAL: m2a_sandbox_raw.log is missing or empty"; exit 1; }

      - name: Upload Linux M2a Sandbox Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-m2a-sandbox-evidence
          path: |
            docs/evidence/m2a_sandbox_results.json
            docs/evidence/m2a_sandbox_raw.log
          if-no-files-found: error

      - name: Set up Rust toolchain for Linux Differential Gate
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Rust Core Binary on Linux
        working-directory: core
        run: |
          cargo build --release

      - name: Run Full Test Suite on Linux (Procfs Telemetry & Bubblewrap Sandbox)
        working-directory: research
        run: |
          python -m unittest discover -s tests -v

      - name: Test PAI CLI Doctor on Linux
        working-directory: research
        run: |
          python pai.py doctor
          python pai.py doctor --json

      - name: Test PAI CLI Models Catalog on Linux
        working-directory: research
        run: |
          python pai.py models list
          python pai.py models list --json

      - name: Test PAI CLI Route on Linux
        working-directory: research
        run: |
          python pai.py route code --explain-route
          python pai.py route chat --explain-route

      - name: Differential Integration Test Suites (Rust Core vs Python Reference on Linux)
        working-directory: research
        run: |
          python -c "
          import sys, os, unittest
          sys.path.insert(0, 'tests')
          sys.path.insert(0, '.')

          ALLOWED_SKIP_REASONS = [
              'Directory junctions are Windows-specific',
          ]

          for flag_val in ('0', '1'):
              os.environ['PAI_USE_RUST_CORE'] = flag_val
              print(f'=== RUNNING DIFFERENTIAL SUITES ON LINUX WITH PAI_USE_RUST_CORE={flag_val} ===')
              loader = unittest.TestLoader()
              suites = [
                  loader.loadTestsFromName('test_bridge_differential'),
                  loader.loadTestsFromName('test_ingest_differential'),
                  loader.loadTestsFromName('test_updater_differential'),
              ]
              all_suite = unittest.TestSuite(suites)
              runner = unittest.TextTestRunner(verbosity=2)
              result = runner.run(all_suite)
              if not result.wasSuccessful():
                  sys.exit(f'FATAL: Linux differential tests failed with PAI_USE_RUST_CORE={flag_val} (failures={len(result.failures)}, errors={len(result.errors)})')
              if result.testsRun < 45:
                  sys.exit(f'FATAL: Expected at least 45 differential tests on Linux, but only {result.testsRun} were executed!')
              for test_case, reason in result.skipped:
                  reason_str = str(reason).strip()
                  if not any(allowed in reason_str for allowed in ALLOWED_SKIP_REASONS):
                      sys.exit(f'FATAL: Linux differential test \'{test_case}\' skipped with unauthorized reason: {reason_str}')
              print(f'SUCCESS: All {result.testsRun} differential tests passed on Linux with PAI_USE_RUST_CORE={flag_val} ({len(result.skipped)} allowed skips).')
          "

