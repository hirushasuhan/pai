name: Release Publisher (Stable & Beta)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.3.0 or 1.4.0-beta.1)'
        required: true
        default: '1.3.0'
      channel:
        description: 'Release Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes (Markdown)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine Version & Channel
        id: vars
        run: |
          python -c "
          import os, re
          event_name = '${{ github.event_name }}'
          if event_name == 'workflow_dispatch':
              ver = '${{ github.event.inputs.version }}'.strip().lstrip('vV')
              chan = '${{ github.event.inputs.channel }}'.strip()
              title = '${{ github.event.inputs.release_title }}'.strip() or f'Personal Agentic AI v{ver}'
              notes = '''${{ github.event.inputs.release_notes }}'''.strip() or f'Automated release of Personal Agentic AI (PAI) v{ver}.'
          else:
              tag = '${{ github.ref_name }}'.strip()
              ver = tag.lstrip('vV')
              chan = 'beta' if re.search(r'(beta|rc|preview|alpha)', ver, re.I) else 'stable'
              title = f'Personal Agentic AI v{ver}'
              notes = f'Automated release of Personal Agentic AI (PAI) v{ver}.'
          is_pre = 'true' if (chan == 'beta' or bool(re.search(r'(beta|rc|preview|alpha)', ver, re.I))) else 'false'
          gh_out = os.environ.get('GITHUB_OUTPUT')
          if gh_out:
              with open(gh_out, 'a', encoding='utf-8') as f:
                  f.write(f'VERSION={ver}\n')
                  f.write(f'CHANNEL={chan}\n')
                  f.write(f'IS_PRERELEASE={is_pre}\n')
                  f.write(f'TITLE={title}\n')
                  f.write(f'NOTES={notes}\n')
                  f.write(f'TAG=v{ver}\n')
          print(f'Configured Release: Version={ver}, Channel={chan}, IsPrerelease={is_pre}, Tag=v{ver}')
          "

      - name: Build Rust Policy Core Binary
        working-directory: core
        run: |
          cargo build --release

      - name: Build Tauri 2.0 Desktop Application
        working-directory: desktop/src-tauri
        run: |
          cargo build --release

      - name: Build Desktop Win32 Helpers (Folder Picker & UIA Agent)
        run: |
          $fw = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          $csc = "$fw\csc.exe"
          $wpf = "$fw\WPF"
          if (Test-Path $csc) {
            if (Test-Path "desktop\bin\pai_folder_picker.cs") {
              & $csc /nologo /target:winexe /out:desktop\bin\pai_folder_picker.exe /r:System.Windows.Forms.dll,System.Drawing.dll desktop\bin\pai_folder_picker.cs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            if (Test-Path "desktop\bin\pai_ui_agent.cs") {
              & $csc /nologo /target:exe /lib:$wpf /out:desktop\bin\pai_ui_agent.exe /r:UIAutomationClient.dll,UIAutomationTypes.dll,WindowsBase.dll,System.Drawing.dll,System.Windows.Forms.dll desktop\bin\pai_ui_agent.cs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Package Desktop Standalone & Payload
        run: |
          python tools/package_release.py --version "${{ steps.vars.outputs.VERSION }}" --channel "${{ steps.vars.outputs.CHANNEL }}" --output-dir dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: ${{ steps.vars.outputs.TITLE }}
          body: ${{ steps.vars.outputs.NOTES }}
          draft: false
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE == 'true' }}
          files: |
            dist/pai-payload-${{ steps.vars.outputs.VERSION }}-win-x64.zip
            dist/pai-desktop-${{ steps.vars.outputs.VERSION }}-win-x64.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
